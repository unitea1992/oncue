# 共通の検査 (ubuntu-latest)。
# UI typecheck / renderer-domain tests / フロントエンドビルド (検証専用) /
# Layer A (renderer-only) / 版の整合 / cargo fmt を pull_request + main push で回す。
#
# 注意:
# - Rust tests/clippy は含めない。src-tauri に cfg(windows) ゲートの
#   コードがあり、Linux 上の test/clippy では本番構成を検証できないため、
#   validate-windows.yml に一任する。ここでは構成非依存の cargo fmt のみ行う。
# - フロントエンドビルドは検証専用。Windows 側へ独立ビルドは追加せず、
#   beforeBuildCommand は一本化のままにする。
# - Layer A は既存 wdio.conf.ts をそのまま使う (本ファイルから読むだけ)。
name: "検査: フロントエンド・版・fmt"

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "README.md"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README.md"

# 最小権限原則: 読み取りのみ
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'
        cache: npm

    # Rust はランナーに入っている stable と rustfmt を使う (fmt だけのため導入を省く)。
    - name: Show Rust toolchain
      run: rustc -V && cargo fmt --version

    - name: Install dependencies
      run: npm ci

    - name: UI typecheck
      run: npm run test:ui:typecheck

    - name: Renderer-domain tests
      run: npm test

    # 版一元性: リリースと同じ検証コマンドで検査する (YAMLへ重複実装しない)
    - name: Check version unity
      run: node scripts/verify-version.mjs

    # 検証専用: 成果物の扱いは変えず、Windows 側へ独立ビルドは追加しない。
    - name: Frontend build (verification only)
      run: npm run build

    # Layer A (renderer-only)。開発サーバーを立てて既存 wdio.conf.ts を実行する。
    # サーバーの起動・停止はこのステップ内で完結させる。
    # ランナー同梱の Chrome と、版の揃った CHROMEWEBDRIVER の chromedriver を使う (wdio.conf.ts)。
    # ランナーは4コアなので、spec を3本並べて走らせる (手元の既定は1本のまま)。
    - name: Layer A UI tests
      env:
        WDIO_MAX_INSTANCES: '3'
      run: |
        npm run dev -- --port 1420 --strictPort &
        vite_pid=$!
        cleanup() { kill "$vite_pid" 2>/dev/null || true; }
        trap cleanup EXIT
        ready=0
        for _ in $(seq 1 60); do
          if curl -fsS -o /dev/null --max-time 2 http://localhost:1420; then ready=1; break; fi
          sleep 2
        done
        if [ "$ready" != "1" ]; then echo 'dev server not ready' >&2; exit 1; fi
        npx wdio run ./wdio.conf.ts
      shell: bash

    - name: Rust fmt
      working-directory: src-tauri
      run: cargo fmt -- --check
