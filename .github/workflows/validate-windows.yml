# Rust の検査。
# src-tauri に cfg(windows) ゲートのコードがあるため、clippy / test は Windows で回す。
# PR では Rust に関わる変更のときだけ clippy / test を回す (npm だけの更新では走らせない)。
# リリース相当のビルドと ZIP の検査は main の push と手動実行だけで行う。
# フロントエンドの型検査・テスト・Layer A・cargo fmt・版の整合は ci.yml が受け持つ。
#
# 注意: tauri-plugin-wdio / wdio capability / withGlobalTauri / test-only surface を
# 通常 Release に混入させないこと。test-only の設定は wdio.conf.ts / tests/ui 内に
# 閉じ込め、tauri.conf.json の capabilities に持ち込まない。
name: "検査: Rust（Windows・MSRV）"

# ホストランナーのみを使い、secrets は参照しない (フォークPRでも安全に実行できる構成を保つ)。
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src-tauri/**"
      - ".github/workflows/validate-windows.yml"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README.md"

# 最小権限原則: 読み取りのみ
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  dependency-msrv:
    name: 依存の MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable action code
        with:
          toolchain: stable

      - name: Resolve Windows dependency metadata
        run: >-
          cargo metadata
          --locked
          --manifest-path src-tauri/Cargo.toml
          --filter-platform x86_64-pc-windows-msvc
          --format-version 1
          > cargo-metadata.json

      - name: Verify dependency MSRV does not exceed application MSRV
        shell: python
        run: |
          import json
          import sys

          with open('cargo-metadata.json', encoding='utf-8') as f:
              metadata = json.load(f)

          root_id = metadata['resolve']['root']
          packages = {package['id']: package for package in metadata['packages']}
          active_ids = {node['id'] for node in metadata['resolve']['nodes']}
          root = packages[root_id]
          declared = root.get('rust_version')

          if not declared:
              print('Application rust-version is not declared.', file=sys.stderr)
              sys.exit(1)

          def version_tuple(value):
              parts = value.split('-', 1)[0].split('.')
              numeric = tuple(int(part) for part in parts)
              return numeric + (0,) * (3 - len(numeric))

          declared_tuple = version_tuple(declared)
          dependencies = []
          offenders = []

          for package_id in active_ids:
              if package_id == root_id:
                  continue
              package = packages[package_id]
              rust_version = package.get('rust_version')
              if not rust_version:
                  continue
              item = (version_tuple(rust_version), package['name'], package['version'], rust_version)
              dependencies.append(item)
              if item[0] > declared_tuple:
                  offenders.append(item)

          dependencies.sort(reverse=True)
          print(f"Application MSRV: Rust {declared}")
          if dependencies:
              _, name, version, rust_version = dependencies[0]
              print(f"Highest declared dependency MSRV: {name} {version} -> Rust {rust_version}")

          if offenders:
              print('Dependencies exceeding application MSRV:', file=sys.stderr)
              for _, name, version, rust_version in sorted(offenders, reverse=True):
                  print(f"- {name} {version}: Rust {rust_version}", file=sys.stderr)
              sys.exit(1)

  validate-windows:
    name: clippy・test（Windows）
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable action code
      with:
        toolchain: stable
        targets: x86_64-pc-windows-msvc
        components: clippy

    # ホストランナーは使い捨てのため、Cargoの依存とビルド成果物はActionsキャッシュで再利用する。
    - name: Cache Rust build
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        workspaces: src-tauri -> target
        # PR は main のキャッシュを復元するだけにし、時間のかかる保存を省く。
        # main の push では保存して次の PR が使えるキャッシュを更新する。
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - name: Clippy
      working-directory: src-tauri
      run: cargo clippy --all-targets --all-features --locked -- -D warnings

    - name: Rust tests
      working-directory: src-tauri
      run: cargo test --lib --locked

    # ここから下は main の push と手動実行だけ (PR では時間がかかるため省く)。
    - name: Setup Node.js
      if: github.event_name != 'pull_request'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'
        cache: npm

    - name: Install dependencies
      if: github.event_name != 'pull_request'
      run: npm ci

    # 版名 ($env:stem/$env:zip/$env:sha) はリリースと同じ検証コマンドの出力を使う。
    - name: Check version unity
      if: github.event_name != 'pull_request'
      run: node scripts/verify-version.mjs
      shell: pwsh

    # リリース互換ビルド (配布物は保存しない)
    - name: Release-compatible build
      if: github.event_name != 'pull_request'
      run: npm run tauri build -- --no-bundle

    # 配布物検査。実装は scripts/package-release.ps1 が正本 (ZIP命名/stage/sha形式の重複実装禁止)。
    # 結果は Artifact にせず、実行の要約に書く。
    - name: Package and hash check
      if: github.event_name != 'pull_request'
      run: |
        $workdir = Join-Path $env:RUNNER_TEMP 'validate'
        New-Item -ItemType Directory -Force -Path $workdir | Out-Null
        $summary = Join-Path $workdir 'validation-summary.txt'
        "ref=$env:GITHUB_REF" | Out-File $summary
        try {
          ./scripts/package-release.ps1 -Stem $env:stem -Zip $env:zip -Sha $env:sha -OutDir $workdir -Summary $summary
        } finally {
          "# Windows validation`n" >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY
          Get-Content $summary >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY
        }
      shell: pwsh
