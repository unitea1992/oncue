name: Build Portable Windows App

# トリガー: 手動実行またはバージョンタグ付きプッシュのみ (配布物を作るジョブのため)
on:
  # 手動実行時 (Actions画面からブランチを選び Run workflow)
  workflow_dispatch:
    inputs:
      ref:
        description: 'Build ref (branch, tag, or SHA; empty = selected branch)'
        required: false
        default: ''

  # バージョンタグ付きプッシュ時
  push:
    tags:
      - 'v*'

# 最小権限原則: デフォルトは読み取りのみ
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------------------
  # 検証 + Windowsポータブルビルド
  # ジョブを分割すると checkout/setup/npm ci が重複するため、
  # 検証から成果物生成まで1ジョブで完結させる。
  # 静的CRTは src-tauri/.cargo/config.toml が正本 (ローカルとCIで一致)。
  # ---------------------------------------------------------------------------
  build-portable-windows:
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 30

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.ref || github.ref }}

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '24'
        cache: npm

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable action code
      with:
        toolchain: stable
        targets: x86_64-pc-windows-msvc
        components: rustfmt, clippy

    # ホストランナーは使い捨てのため、Cargoの依存とビルド成果物はActionsキャッシュで再利用する。
    - name: Cache Rust build
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        workspaces: src-tauri -> target

    - name: Install dependencies
      run: npm ci

    - name: Frontend tests
      run: npm test

    - name: Rust fmt
      working-directory: src-tauri
      run: cargo fmt -- --check

    - name: Clippy
      working-directory: src-tauri
      run: cargo clippy --all-targets --all-features --locked -- -D warnings

    - name: Rust tests
      working-directory: src-tauri
      run: cargo test --lib --locked

    # 版一元性: package.json正本・SemVer・Cargo同期・Tauri解決版・タグ・UA・成果物名を検査。
    # 判定本体は scripts/verify-version.mjs が正本 (YAML側に解析ロジックを持たせない)。
    # version/arch/stem/zip/sha/prerelease/stableはスクリプトがGITHUB_ENVへ書く (受け取るだけ)。
    - name: Check version unity
      run: node scripts/verify-version.mjs
      shell: pwsh

    # フロントエンドの本番ビルドはtauri.conf.jsonのbeforeBuildCommandで1回だけ実行する。
    - name: Build portable executable
      run: npm run tauri build -- --no-bundle

    # 配布用ZIP化 (#134実績の抽出。版名は版ゲートの出力 ($env:stem/$env:zip/$env:sha)
    # をそのまま使う。YAML側で組み立てない。実装は scripts/package-release.ps1 が正本)
    - name: Create portable ZIP
      run: ./scripts/package-release.ps1 -Stem $env:stem -Zip $env:zip -Sha $env:sha
      shell: pwsh

    # CI回帰確認: 実成果物の正確な名前を確かめ、旧portable/windows名の混入を否定する
    - name: Assert canonical artifact names
      run: |
        if (-not $env:zip -or -not $env:sha) { throw 'version metadata missing (Check version unity must run first)' }
        if ($env:zip -match 'portable|windows') { throw "non-canonical zip name: $env:zip" }
        if ($env:sha -match 'portable|windows') { throw "non-canonical sha name: $env:sha" }
        if ($env:zip -notmatch '^oncue-.+-(x64|arm64)\.zip$') { throw "zip name not canonical: $env:zip" }
        if ($env:sha -ne "$env:zip.sha256") { throw "sha name must equal zip + '.sha256': $env:sha" }
        if (-not (Test-Path -LiteralPath $env:zip -PathType Leaf)) { throw "ZIP not found: $env:zip" }
        if (-not (Test-Path -LiteralPath $env:sha -PathType Leaf)) { throw "SHA not found: $env:sha" }
        $leaks = @(Get-ChildItem -File | Where-Object { $_.Name -match 'portable|windows' -and ($_.Extension -eq '.zip' -or $_.Name -like '*.sha256') })
        if ($leaks.Count -gt 0) { throw ('non-canonical artifacts present: ' + (($leaks | ForEach-Object { $_.Name }) -join ', ')) }
      shell: pwsh

    # 実成果物の安全なスモークテスト (起動→生存→終了。data/logs内容は読まない)
    - name: Smoke portable package
      run: ./scripts/smoke-portable.ps1 -ZipPath $env:zip
      shell: pwsh

    # 成果物として保存 (版stemへ寄せ、portable-windows別名を増やさない)
    - name: Upload artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ env.stem }}
        path: |
          ${{ env.zip }}
          ${{ env.sha }}
        # Public リポジトリの成果物はログインした第三者も取得できる。作者の動作確認と
        # Native E2E・下書きRelease作成に必要な期間だけ残す。
        retention-days: 1

  # ---------------------------------------------------------------------------
  # リリースジョブ (タグ付きプッシュ時のみ。ドラフトReleaseを作成し、公開は手動で行う)
  # ---------------------------------------------------------------------------
  release:
    runs-on: ubuntu-latest
    needs: build-portable-windows
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 10
    permissions:
      contents: write  # リリース作成用

    steps:
    # リリース側も同一スクリプトで最終確認 (YAMLへの重複実装なし。タグ不一致はここで失敗させる。プレリリース判定もスクリプト出力に従う)
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.ref }}

    - name: Verify version unity
      run: node scripts/verify-version.mjs

    - name: Download artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ env.stem }}
        path: ./

    - name: Create Release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        files: |
          ${{ env.zip }}
          ${{ env.sha }}
        draft: true
        prerelease: ${{ env.prerelease == 'true' }}
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
